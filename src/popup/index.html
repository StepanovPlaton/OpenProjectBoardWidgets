<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenProject Board Widgets</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>OP Board Widgets</h1>

      <section class="section">
        <h2>Подключение</h2>
        <label>
          Base URL
          <input id="baseUrl" type="url" placeholder="http://83.222.19.230:8081" />
        </label>
        <label>
          API token
          <input id="token" type="password" placeholder="opapi-…" autocomplete="off" />
        </label>
        <div class="row">
          <button id="testBtn" type="button">Проверить</button>
          <span id="status" class="status" role="status"></span>
        </div>
      </section>

      <section class="section">
        <label class="check">
          <input id="hideNativeStrip" type="checkbox" />
          Скрыть нативную цветную полоску
        </label>
        <label class="check">
          <input id="overviewRedesign" type="checkbox" />
          Новый дизайн вкладки Обзор
        </label>
        <label class="check">
          <input id="overviewExtended" type="checkbox" />
          Расширенный раздел Обзор
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="priorityEnabled" type="checkbox" />
          Приоритет (P1…P5: безотлагательный→низкий)
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="departmentEnabled" type="checkbox" />
          Отдел в заголовке
        </label>
        <label>
          Поле отдела
          <select id="departmentField"></select>
        </label>
        <label>
          Мой отдел
          <select id="departmentFilterValue"></select>
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="storyPointsEnabled" type="checkbox" />
          Story Points
        </label>
        <label>
          Поле SP
          <select id="storyPointsField"></select>
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="blockersEnabled" type="checkbox" />
          Блокеры (все связи)
        </label>
        <label>
          Статусы «готово» (по одному на строку) — для блокеров и возвратов
          <textarea id="doneStatuses" rows="3" spellcheck="false"></textarea>
        </label>
        <label class="check">
          <input id="treatClosedAsDone" type="checkbox" />
          Считать closed задачи выполненными
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="reworkReturnsEnabled" type="checkbox" />
          Возвраты в доработку
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="notificationsEnabled" type="checkbox" />
          Уведомления на карточках и тосты
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="columnTimeEnabled" type="checkbox" />
          Время в колонке
        </label>
      </section>

      <div class="actions">
        <button id="saveBtn" type="button" class="primary">Сохранить</button>
        <button id="clearCacheBtn" type="button">Очистить кэш</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
