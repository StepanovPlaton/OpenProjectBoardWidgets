<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenProject Board Widgets</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>OP Board Widgets</h1>

      <section class="section">
        <h2>Подключение</h2>
        <label>
          Base URL
          <input id="baseUrl" type="url" placeholder="http://83.222.19.230:8081" />
        </label>
        <label>
          API token
          <input id="token" type="password" placeholder="opapi-…" autocomplete="off" />
        </label>
        <div class="row">
          <button id="testBtn" type="button">Проверить</button>
          <span id="status" class="status" role="status"></span>
        </div>
      </section>

      <section class="section">
        <label class="check">
          <input id="hideNativeStrip" type="checkbox" />
          Скрыть нативную цветную полоску
        </label>
        <label class="check">
          <input id="overviewRedesign" type="checkbox" />
          Новый дизайн вкладки Обзор
        </label>
        <label class="check">
          <input id="overviewExtended" type="checkbox" />
          Расширенный раздел Обзор
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="priorityEnabled" type="checkbox" />
          Приоритет (P1…P5: безотлагательный→низкий)
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="departmentEnabled" type="checkbox" />
          Отдел в заголовке
        </label>
        <label>
          Поле отдела
          <select id="departmentField"></select>
        </label>
        <label>
          Мой отдел
          <select id="departmentFilterValue"></select>
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="storyPointsEnabled" type="checkbox" />
          Story Points
        </label>
        <label>
          Поле SP
          <select id="storyPointsField"></select>
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="reviewEnabled" type="checkbox" />
          Review AI (GitHub Copilot) — иконка после CI
        </label>
        <label>
          Поле статуса review
          <select id="reviewField"></select>
        </label>
        <div class="review-ids">
          <label>
            ID зелёного
            <input id="reviewGreenId" type="text" inputmode="numeric" placeholder="6" spellcheck="false" />
          </label>
          <label>
            ID жёлтого
            <input id="reviewYellowId" type="text" inputmode="numeric" placeholder="7" spellcheck="false" />
          </label>
          <label>
            ID красного
            <input id="reviewRedId" type="text" inputmode="numeric" placeholder="8" spellcheck="false" />
          </label>
        </div>
        <p class="hint">
          Сравнивается ID опции кастомного поля (например, хвост href <code>/custom_options/6</code>).
        </p>
      </section>

      <section class="section">
        <label class="check">
          <input id="blockersEnabled" type="checkbox" />
          Блокеры (все связи)
        </label>
        <label>
          Статусы «готово» (по одному на строку) — для блокеров и возвратов
          <textarea id="doneStatuses" rows="3" spellcheck="false"></textarea>
        </label>
        <label class="check">
          <input id="treatClosedAsDone" type="checkbox" />
          Считать closed задачи выполненными
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="reworkReturnsEnabled" type="checkbox" />
          Возвраты в доработку
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="notificationsEnabled" type="checkbox" />
          Уведомления на карточках и тосты
        </label>
      </section>

      <section class="section">
        <label class="check">
          <input id="columnTimeEnabled" type="checkbox" />
          Время в колонке
        </label>
      </section>

      <section class="section">
        <h2>WIP-лимиты</h2>
        <label class="check">
          <input id="wipEnabled" type="checkbox" />
          Показывать WIP (счётчик / лимит, жёлтый / красный)
        </label>
        <label class="check">
          <input id="wipBorderEnabled" type="checkbox" />
          Красная рамка колонки при превышении
        </label>
        <label class="check">
          <input id="wipUseDefaults" type="checkbox" />
          Включить настройки по умолчанию
        </label>
        <div id="wipDefaultsPreview" class="wip-defaults-preview" hidden>
          <ul class="wip-defaults-list">
            <li><span>In Progress</span><span>10</span></li>
            <li><span>Review</span><span>3</span></li>
            <li><span>QA</span><span>2</span></li>
          </ul>
        </div>
        <div id="wipCustomPanel">
          <div class="wip-limits-head">
            <span>Подстрока статуса</span>
            <span>Лимит</span>
            <span></span>
          </div>
          <div id="wipLimits" class="wip-limits"></div>
          <button id="wipAddBtn" type="button" class="wip-add">+ Добавить правило</button>
          <p class="hint">Если имя статуса содержит подстроку (без учёта регистра), применяется лимит. Например, <code>progress</code> → «In progress».</p>
        </div>
      </section>

      <div class="actions">
        <button id="saveBtn" type="button" class="primary">Сохранить</button>
        <button id="clearCacheBtn" type="button">Очистить кэш</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
